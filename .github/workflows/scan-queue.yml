# Scans skills that amdahl.ai has waiting, then posts the results back.
#
# The scanners READ each SKILL.md. Nothing submitted is ever executed.
# This repo is public, so these logs are public: the scripts print only the
# item kind, its place in the queue and the three results. They never print
# the id (a submission's id is the only key to its status on amdahl.ai), the
# skill text or the token.
name: Scan queue

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A run that starts while another is going waits for it.
concurrency:
  group: scan-queue
  cancel-in-progress: false

jobs:
  scan:
    name: Scan skills waiting on amdahl.ai
    if: github.repository == 'amdahlco/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMDAHL_SITE: ${{ vars.AMDAHL_SITE || 'https://amdahl.ai' }}
    steps:
      - name: Check out the scan code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch the queue
        id: queue
        timeout-minutes: 2
        env:
          SKILLS_SCAN_TOKEN: ${{ secrets.SKILLS_SCAN_TOKEN }}
        run: python3 -I scripts/scan_queue.py fetch --out "$RUNNER_TEMP/queue.json"

      - name: Install the scanners
        if: steps.queue.outputs.count != '0'
        timeout-minutes: 10
        run: bash scripts/install_scanners.sh

      - name: Scan and post results
        if: steps.queue.outputs.count != '0' || steps.queue.outputs.invalid != '0'
        timeout-minutes: 15
        env:
          SKILLS_SCAN_TOKEN: ${{ secrets.SKILLS_SCAN_TOKEN }}
          SCAN_TIMEOUT_SECONDS: "180"
        run: python3 -I scripts/scan_queue.py run --queue "$RUNNER_TEMP/queue.json"
